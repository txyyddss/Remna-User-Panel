name: CI

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Audit and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Generate API types
        working-directory: web
        run: npm run generate:api

      - name: Lint frontend
        working-directory: web
        run: npm run lint

      - name: Type-check frontend
        working-directory: web
        run: npm run typecheck

      - name: Test frontend
        working-directory: web
        run: npm run test

      - name: Audit frontend dependencies
        working-directory: web
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true

      - name: Download and verify Go modules
        run: |
          go mod download
          go mod verify

      - name: Check Go formatting
        shell: bash
        run: |
          files="$(gofmt -l $(find cmd internal -type f -name '*.go'))"
          if [ -n "$files" ]; then
            printf 'The following files require gofmt:\n%s\n' "$files"
            exit 1
          fi

      - name: Vet Go packages
        run: go vet ./...

      - name: Test Go packages with race detector
        run: go test -race ./...

      - name: Enforce domain coverage
        shell: bash
        run: |
          packages=(
            ./internal/accounts
            ./internal/admin
            ./internal/billing
            ./internal/catalog
            ./internal/entitlements
          )
          go test -covermode=atomic -coverprofile=domain-coverage.out "${packages[@]}"
          go tool cover -func=domain-coverage.out
          total="$(go tool cover -func=domain-coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          awk -v total="$total" 'BEGIN { if ((total + 0) < 80) { printf "coverage %.1f%% is below 80%%\n", total; exit 1 } }'

      - name: Scan Go dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate production image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
