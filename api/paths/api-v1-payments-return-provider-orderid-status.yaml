get:
  tags: [Billing]
  operationId: getPaymentReturnStatus
  summary: Poll a provider-return payment receipt
  description: Returns a narrow receipt projection for a short-lived signed provider-return capability. It never exposes the owner, checkout, QR, trade, or provider payload data and never changes payment state.
  security: []
  parameters:
    - name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [ezpay, bepusdt]
    - name: orderID
      in: path
      required: true
      schema:
        $ref: '../openapi.yaml#/components/schemas/ID'
    - name: capability
      in: query
      required: true
      schema:
        type: string
        pattern: '^[0-9]+\.[a-f0-9]{64}$'
  responses:
    '200':
      description: Current durable payment receipt projection.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/PaymentReturnStatus'
    '404':
      $ref: '../openapi.yaml#/components/responses/NotFound'
