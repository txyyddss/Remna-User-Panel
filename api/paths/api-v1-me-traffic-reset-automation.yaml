get:
  tags: [Catalog]
  operationId: getTrafficResetAutomation
  summary: Get the account-wide automatic traffic reset preference
  responses:
    '200':
      description: Current automatic traffic reset preference.
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/TrafficResetAutomation' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }

put:
  tags: [Catalog]
  operationId: updateTrafficResetAutomation
  summary: Enable or disable account-wide automatic traffic resets
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required: [enabled]
          properties:
            enabled: { type: boolean }
  responses:
    '200':
      description: Updated automatic traffic reset preference.
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/TrafficResetAutomation' }
    '400': { $ref: '../openapi.yaml#/components/responses/BadRequest' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
