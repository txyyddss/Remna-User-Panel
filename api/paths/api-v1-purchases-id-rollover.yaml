get:
  tags: [Catalog]
  operationId: getPurchaseRollover
  summary: Get a fresh live rollover projection
  description: Returns aggregate rollover values for the authenticated owner's active purchase. The provider usage snapshot is fetched on demand through the upstream queue and is not persisted.
  parameters:
    - name: id
      in: path
      required: true
      schema: { $ref: '../openapi.yaml#/components/schemas/ID' }
  responses:
    '200':
      description: Live rollover projection.
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/RolloverProjection' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
    '409': { $ref: '../openapi.yaml#/components/responses/Conflict' }
    '502': { $ref: '../openapi.yaml#/components/responses/UpstreamFailure' }
