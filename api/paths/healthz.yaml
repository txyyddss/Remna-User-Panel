get:
  tags: [Operations]
  operationId: getLiveness
  summary: HTTP and local database liveness
  security: []
  responses:
    '200':
      description: The process can serve HTTP and SQLite responds.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/HealthStatus'
    '503':
      description: The process is serving HTTP but SQLite is unavailable.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ApiError'
