post:
  tags: [Activity]
  operationId: playLuckyDraw
  summary: Pay the configured fee and apply one weighted prize atomically
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/ActivityDrawRequest'
  responses:
    '201':
      description: Immutable draw result and typed reward.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ActivityResult'
    '400':
      $ref: '../openapi.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '409':
      $ref: '../openapi.yaml#/components/responses/Conflict'
    '422':
      $ref: '../openapi.yaml#/components/responses/Unprocessable'
