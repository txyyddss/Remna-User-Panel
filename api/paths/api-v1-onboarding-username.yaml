put:
  tags: [Onboarding]
  operationId: reserveUsername
  summary: Reserve the immutable service username
  description: |
    Accepts only `^[a-zA-Z0-9_-]{3,36}$`. The service checks local uniqueness, performs
    a Remnawave preflight, and also treats Remnawave `A019` as a duplicate if
    the upstream race is lost.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/UsernameRequest'
  responses:
    '200':
      description: Username reserved and onboarding advanced.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/AuthState'
    '400':
      $ref: '../openapi.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '409':
      $ref: '../openapi.yaml#/components/responses/Conflict'
    '422':
      $ref: '../openapi.yaml#/components/responses/Unprocessable'
