post:
  tags: [Questionnaires]
  operationId: participateInQuestionnaire
  summary: Create or retrieve this user's durable validation code
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ResourceID'
    - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
  responses:
    '200':
      description: Existing or newly created participant record.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/QuestionnaireParticipation'
    '400':
      $ref: '../openapi.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '404':
      $ref: '../openapi.yaml#/components/responses/NotFound'
    '409':
      $ref: '../openapi.yaml#/components/responses/Conflict'
