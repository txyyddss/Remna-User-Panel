put:
  tags: [Emby]
  operationId: updateEmbyPreferences
  summary: Replace the allowed Emby rating and library preferences
  description: The server fetches the current upstream policy and overlays only approved preference fields plus mandatory restrictions.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/EmbyPreferencesRequest'
  responses:
    '200':
      description: Updated safe account projection.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/EmbyAccount'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '422':
      $ref: '../openapi.yaml#/components/responses/Unprocessable'
    '502':
      $ref: '../openapi.yaml#/components/responses/UpstreamFailure'
