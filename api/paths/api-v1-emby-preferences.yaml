put:
  tags: [Emby]
  operationId: updateEmbyPreferences
  summary: Replace the allowed Emby rating and library preferences
  description: The worker fetches the current upstream policy, applies the exact approved projection, and verifies it before completing.
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/EmbyPreferencesRequest'
  responses:
    '202':
      description: Preference update queued or replayed.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/OperationReceipt'
    '400':
      $ref: '../openapi.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '409':
      $ref: '../openapi.yaml#/components/responses/Conflict'
    '422':
      $ref: '../openapi.yaml#/components/responses/Unprocessable'
    '502':
      $ref: '../openapi.yaml#/components/responses/UpstreamFailure'
