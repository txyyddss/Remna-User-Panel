get:
  tags: [Admin]
  operationId: getAdminSquadNodes
  summary: List live Remnawave nodes and actual squad accessibility
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ResourceID'
  responses:
    '200':
      description: Nodes with upstream multipliers, ISO country codes, active inbound UUIDs, and verified accessibility.
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/RemnaNodeList' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    '502': { $ref: '../openapi.yaml#/components/responses/UpstreamFailure' }
put:
  tags: [Admin]
  operationId: updateAdminSquadNodes
  summary: Replace squad node selection through active inbound unions
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ResourceID'
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../openapi.yaml#/components/schemas/SquadNodeWrite' }
  responses:
    '200':
      description: Re-fetched actual upstream accessibility after the patch.
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/RemnaNodeList' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    '422': { $ref: '../openapi.yaml#/components/responses/Unprocessable' }
    '502': { $ref: '../openapi.yaml#/components/responses/UpstreamFailure' }
