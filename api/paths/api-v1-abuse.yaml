memberRecords:
  get:
    tags: [Member]
    operationId: getAbuseRecords
    parameters: [{ name: cursor, in: query, schema: { type: string, maxLength: 512 } }]
    responses: { '200': { content: { application/json: { schema: { type: object } } } } }
agentReport:
  post:
    tags: [Agent]
    operationId: uploadQPSReport
    security: []
    requestBody: { required: true, content: { text/plain: { schema: { type: string, maxLength: 16777216 } } } }
    responses: { '200': { content: { application/json: { schema: { type: object } } } }, '401': { $ref: '../components/responses.yaml#/Unauthorized' } }
policy:
  get: { tags: [Admin], operationId: getAbusePolicy, responses: { '200': { content: { application/json: { schema: { type: object } } } } } }
  put: { tags: [Admin], operationId: updateAbusePolicy, parameters: [{ $ref: '../components/parameters.yaml#/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [globalEnabled, globalLimit, warningValidityDays, warningCooldownMinutes, revision], properties: { globalEnabled: { type: boolean }, globalLimit: { type: integer, minimum: 0, maximum: 100000 }, warningValidityDays: { type: integer, minimum: 1, maximum: 365 }, warningCooldownMinutes: { type: integer, minimum: 0, maximum: 525600 }, revision: { type: integer, minimum: 0 } } } } } }, responses: { '200': { content: { application/json: { schema: { type: object } } } } } }
nodes:
  get: { tags: [Admin], operationId: getAbuseNodes, responses: { '200': { content: { application/json: { schema: { type: array, items: { type: object } } } } } } }
nodeKey:
  get: { tags: [Admin], operationId: copyAbuseNodeKey, responses: { '200': { content: { application/json: { schema: { type: object } } } } } }
nodeRotate:
  post: { tags: [Admin], operationId: rotateAbuseNodeKey, parameters: [{ $ref: '../components/parameters.yaml#/IdempotencyKey' }], responses: { '200': { content: { application/json: { schema: { type: object } } } } } }
rules:
  get: { tags: [Admin], operationId: getAbuseRules, responses: { '200': { content: { application/json: { schema: { type: array, items: { type: object } } } } } } }
  post: { tags: [Admin], operationId: createAbuseRule, parameters: [{ $ref: '../components/parameters.yaml#/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { type: object } } } }, responses: { '200': { content: { application/json: { schema: { type: object } } } } } }
rule:
  put: { tags: [Admin], operationId: updateAbuseRule, parameters: [{ $ref: '../components/parameters.yaml#/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { type: object } } } }, responses: { '200': { content: { application/json: { schema: { type: object } } } } } }
  delete: { tags: [Admin], operationId: deleteAbuseRule, parameters: [{ $ref: '../components/parameters.yaml#/IdempotencyKey' }, { name: revision, in: query, required: true, schema: { type: integer, minimum: 0 } }], responses: { '204': { description: Deleted } } }
whitelist:
  get: { tags: [Admin], operationId: getAbuseWhitelist, responses: { '200': { content: { application/json: { schema: { type: array, items: { type: string } } } } } } }
whitelistItem:
  put: { tags: [Admin], operationId: updateAbuseWhitelist, parameters: [{ $ref: '../components/parameters.yaml#/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { type: object } } } }, responses: { '204': { description: Updated } } }
punishments:
  get: { tags: [Admin], operationId: getAbusePunishments, responses: { '200': { content: { application/json: { schema: { type: array, items: { type: object } } } } } } }
punishment:
  put: { tags: [Admin], operationId: updateAbusePunishment, parameters: [{ $ref: '../components/parameters.yaml#/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { type: object } } } }, responses: { '200': { content: { application/json: { schema: { type: object } } } } } }
statistics:
  get: { tags: [Admin], operationId: getAbuseStatistics, responses: { '200': { content: { application/json: { schema: { type: object } } } } } }
records:
  get: { tags: [Admin], operationId: getAdminAbuseRecords, parameters: [{ name: cursor, in: query, schema: { type: string, maxLength: 512 } }], responses: { '200': { content: { application/json: { schema: { type: object } } } } } }
record:
  delete: { tags: [Admin], operationId: deleteAbuseRecord, parameters: [{ $ref: '../components/parameters.yaml#/IdempotencyKey' }], responses: { '204': { description: Deleted } } }
