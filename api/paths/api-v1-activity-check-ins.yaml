post:
  tags: [Activity]
  operationId: checkInActivity
  summary: Claim the configured reward once per local calendar day
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
  responses:
    '200':
      description: New or replayed daily check-in result.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ActivityResult'
    '400':
      $ref: '../openapi.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '409':
      $ref: '../openapi.yaml#/components/responses/Conflict'
