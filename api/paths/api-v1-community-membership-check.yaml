get:
  tags: [Community]
  operationId: getCommunityAccess
  summary: Check current community access
  description: Returns whether the authenticated member has a current active combo. This read-only check does not refresh Telegram membership facts.
  responses:
    '200':
      description: Current community access eligibility.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/CommunityAccess'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '409':
      $ref: '../openapi.yaml#/components/responses/Conflict'
    '502':
      $ref: '../openapi.yaml#/components/responses/UpstreamFailure'

post:
  tags: [Community]
  operationId: checkCommunityMembership
  summary: Refresh community membership and active-combo eligibility
  description: Calls Telegram `getChatMember` for both configured spaces and evaluates only a current `active` combo window.
  responses:
    '200':
      description: Canonical membership facts, active-combo eligibility, and refreshed user state.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/CommunityMembership'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '409':
      $ref: '../openapi.yaml#/components/responses/Conflict'
    '502':
      $ref: '../openapi.yaml#/components/responses/UpstreamFailure'
