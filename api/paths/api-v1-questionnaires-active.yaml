get:
  tags: [Questionnaires]
  operationId: getActiveQuestionnaire
  summary: Get the single active questionnaire and durable validation code
  responses:
    '200':
      description: Active questionnaire, or JSON null when none is active.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '../openapi.yaml#/components/schemas/ActiveQuestionnaire'
              - type: 'null'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '409':
      $ref: '../openapi.yaml#/components/responses/Conflict'
