post:
  tags: [Catalog]
  operationId: quotePurchase
  summary: Calculate a non-mutating authoritative purchase quote
  description: Revalidates the live combo, coupon, add-ons, active term, and upstream squad identities without debiting balance.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/PurchaseRequest'
  responses:
    '200':
      description: Current price and effective entitlement dates.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/PurchaseQuote'
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '409': { $ref: '../openapi.yaml#/components/responses/Conflict' }
    '422': { $ref: '../openapi.yaml#/components/responses/Unprocessable' }
    '502': { $ref: '../openapi.yaml#/components/responses/UpstreamFailure' }
