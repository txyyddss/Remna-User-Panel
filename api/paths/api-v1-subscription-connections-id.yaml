get:
  tags: [Dashboard]
  operationId: pollSubscriptionConnections
  summary: Poll a member connection scan
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ConnectionScanID'
  responses:
    '200':
      description: Current scan progress and completed connection handles.
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/ConnectionScan' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
