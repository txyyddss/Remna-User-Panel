get:
  tags: [Dashboard]
  operationId: getConnectivitySummary
  summary: Get this member's current-squad uptime over the last 24 hours
  description: Credential-free projection of retained checks under the current monitoring configuration. Incomplete measurements remain neutral gaps. Requires an onboarded session; inactive combos return activeCombo false.
  responses:
    '200':
      description: Member uptime summary, with no proxy credentials or probe diagnostics.
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/UptimeSummary' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
    '409': { $ref: '../openapi.yaml#/components/responses/Conflict' }
    '502': { $ref: '../openapi.yaml#/components/responses/UpstreamFailure' }
