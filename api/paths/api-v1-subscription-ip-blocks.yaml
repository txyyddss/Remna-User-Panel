get:
  tags: [Dashboard]
  operationId: listSubscriptionIPBlocks
  summary: List the member's active node-scoped IP blocks
  responses:
    '200':
      description: Active blocks, including pending provider states.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items]
            properties:
              items:
                type: array
                items: { $ref: '../openapi.yaml#/components/schemas/IPBlock' }
    '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
