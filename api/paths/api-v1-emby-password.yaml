put:
  tags: [Emby]
  operationId: changeEmbyPassword
  summary: Queue a write-only linked Emby password change
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/EmbyPasswordRequest'
  responses:
    '202':
      description: Password change queued or replayed; plaintext is not returned.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/OperationReceipt'
    '400':
      $ref: '../openapi.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '409':
      $ref: '../openapi.yaml#/components/responses/Conflict'
    '422':
      $ref: '../openapi.yaml#/components/responses/Unprocessable'
    '502':
      $ref: '../openapi.yaml#/components/responses/UpstreamFailure'
