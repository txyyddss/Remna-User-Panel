put:
  tags: [Emby]
  operationId: changeEmbyPassword
  summary: Change the linked Emby password synchronously
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/EmbyPasswordRequest'
  responses:
    '204':
      description: Password changed; plaintext is not returned or retained.
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '422':
      $ref: '../openapi.yaml#/components/responses/Unprocessable'
    '502':
      $ref: '../openapi.yaml#/components/responses/UpstreamFailure'
