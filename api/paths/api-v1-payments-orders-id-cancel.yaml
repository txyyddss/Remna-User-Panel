post:
  tags: [Billing]
  operationId: cancelPaymentOrder
  summary: Cancel a user-owned unpaid payment order
  description: |
    Stops order polling and records a durable provider cancellation command.
    Interrupted provider attempts are reconciled from stored state or remain
    pending review. A later authoritative paid event may still settle once.
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ResourceID'
    - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
  responses:
    '202':
      description: Durable cancellation operation accepted.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/PaymentOperation'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '404':
      $ref: '../openapi.yaml#/components/responses/NotFound'
    '409':
      $ref: '../openapi.yaml#/components/responses/Conflict'
    '500':
      $ref: '../openapi.yaml#/components/responses/InternalFailure'
