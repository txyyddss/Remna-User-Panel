post:
  tags: [Admin]
  operationId: retryAdminJob
  summary: Make a failed retryable job available now
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ResourceID'
  responses:
    '204':
      description: Job scheduled for retry.
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '403':
      $ref: '../openapi.yaml#/components/responses/Forbidden'
    '404':
      $ref: '../openapi.yaml#/components/responses/NotFound'
    '409':
      $ref: '../openapi.yaml#/components/responses/Conflict'
