get:
  tags: [Questionnaires]
  operationId: getQuestionnaireHistory
  summary: List this user's questionnaire participations
  responses:
    '200':
      description: Questionnaire and validation-code history.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/QuestionnaireHistoryList'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '500':
      $ref: '../openapi.yaml#/components/responses/InternalFailure'
