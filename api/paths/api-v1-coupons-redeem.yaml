post:
  tags: [Coupons]
  operationId: redeemCoupon
  summary: Redeem one canonical coupon code
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/CouponRedeemRequest'
  responses:
    '200':
      description: Idempotent redemption, wallet grant, or immediate balance effect.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/CouponRedemption'
    '400':
      $ref: '../openapi.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '409':
      $ref: '../openapi.yaml#/components/responses/Conflict'
    '422':
      $ref: '../openapi.yaml#/components/responses/Unprocessable'
