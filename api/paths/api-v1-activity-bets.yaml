post:
  tags: [Activity]
  operationId: playActivityGame
  summary: Debit a stake and record a cryptographically selected result
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/ActivityBetRequest'
  responses:
    '201':
      description: Immutable bet result with its balance projection.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ActivityResult'
    '400':
      $ref: '../openapi.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '409':
      $ref: '../openapi.yaml#/components/responses/Conflict'
    '422':
      $ref: '../openapi.yaml#/components/responses/Unprocessable'
