get:
  tags: [Billing]
  operationId: getPaymentOrder
  summary: Poll durable payment state
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/ResourceID'
  responses:
    '200':
      description: Current authoritative order state.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/PaymentOrder'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '404':
      $ref: '../openapi.yaml#/components/responses/NotFound'
