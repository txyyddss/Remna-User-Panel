post:
  tags: [Billing]
  operationId: createPaymentOrder
  summary: Create a balance top-up order
  description: |
    The requested TXB minor units are divided by the required `txb_per_cny`,
    `txb_per_usd`, or `txb_per_xtr` fixed-decimal rate and rounded upward at
    provider precision. A successful authoritative callback credits exactly
    `txbMinor`. Aged terminal detail is compacted only by backup-gated
    maintenance while callback tombstones remain permanent. Provider checkout creation runs from a durable
    operation and is never blindly retried after an ambiguous attempt.
  parameters:
    - $ref: '../openapi.yaml#/components/parameters/IdempotencyKey'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/PaymentOrderRequest'
  responses:
    '202':
      description: Durable checkout-creation operation accepted.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/PaymentOperation'
    '400':
      $ref: '../openapi.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '409':
      $ref: '../openapi.yaml#/components/responses/Conflict'
    '422':
      $ref: '../openapi.yaml#/components/responses/Unprocessable'
    '500':
      $ref: '../openapi.yaml#/components/responses/InternalFailure'
