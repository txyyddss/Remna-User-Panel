QuestionnaireParticipation:
  type: object
  additionalProperties: false
  required: [id, questionnaireId, validationCode, awardedAt, createdAt]
  properties:
    id:
      $ref: '../../openapi.yaml#/components/schemas/ID'
    questionnaireId:
      $ref: '../../openapi.yaml#/components/schemas/ID'
    validationCode:
      type: string
      pattern: '^TXQ-[A-Z2-7]+$'
    awardedAt:
      type: [string, 'null']
      format: date-time
    createdAt:
      $ref: '../../openapi.yaml#/components/schemas/Timestamp'

ActiveQuestionnaire:
  type: object
  additionalProperties: false
  required: [id, title, description, formUrl, rewardTxbMinor, closesAt, participation]
  properties:
    id:
      $ref: '../../openapi.yaml#/components/schemas/ID'
    title:
      type: string
    description:
      type: string
    formUrl:
      type: string
      format: uri
    rewardTxbMinor:
      type: string
      pattern: '^\d+$'
    closesAt:
      type: [string, 'null']
      format: date-time
    participation:
      oneOf:
        - $ref: '../../openapi.yaml#/components/schemas/QuestionnaireParticipation'
        - type: 'null'

QuestionnaireHistoryItem:
  type: object
  additionalProperties: false
  required: [questionnaire, participation]
  properties:
    questionnaire:
      $ref: '../../openapi.yaml#/components/schemas/Questionnaire'
    participation:
      $ref: '../../openapi.yaml#/components/schemas/QuestionnaireParticipation'

QuestionnaireHistoryList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '../../openapi.yaml#/components/schemas/QuestionnaireHistoryItem'

QuestionnaireImportStatus:
  type: string
  enum: [preview, queued, processing, settled, failed]

QuestionnaireImportAnalysis:
  type: object
  additionalProperties: false
  required: [importId, questionnaireId, codeColumn, matchedCount, duplicateCount, unknownCount, malformedCount, alreadyAwardedCount]
  properties:
    importId:
      $ref: '../../openapi.yaml#/components/schemas/ID'
    questionnaireId:
      $ref: '../../openapi.yaml#/components/schemas/ID'
    codeColumn:
      type: string
    matchedCount:
      type: integer
      minimum: 0
    duplicateCount:
      type: integer
      minimum: 0
    unknownCount:
      type: integer
      minimum: 0
    malformedCount:
      type: integer
      minimum: 0
    alreadyAwardedCount:
      type: integer
      minimum: 0

QuestionnaireImportPreview:
  type: object
  additionalProperties: false
  required: [id, questionnaireId, status, delimiter, headers, sampleRows, dataRowCount, malformedRowCount, createdAt, updatedAt]
  properties:
    id:
      $ref: '../../openapi.yaml#/components/schemas/ID'
    questionnaireId:
      $ref: '../../openapi.yaml#/components/schemas/ID'
    status:
      $ref: '../../openapi.yaml#/components/schemas/QuestionnaireImportStatus'
    delimiter:
      type: string
      enum: [comma, semicolon, tab]
    headers:
      type: array
      minItems: 1
      maxItems: 100
      items:
        type: string
    sampleRows:
      type: array
      maxItems: 10
      items:
        type: array
        maxItems: 100
        items:
          type: string
    dataRowCount:
      type: integer
      minimum: 0
      maximum: 50000
    malformedRowCount:
      type: integer
      minimum: 0
    codeColumn:
      type: string
    analysis:
      $ref: '../../openapi.yaml#/components/schemas/QuestionnaireImportAnalysis'
    idempotencyKey:
      type: string
    createdAt:
      $ref: '../../openapi.yaml#/components/schemas/Timestamp'
    updatedAt:
      $ref: '../../openapi.yaml#/components/schemas/Timestamp'

QuestionnaireImportAnalyzeRequest:
  type: object
  additionalProperties: false
  required: [codeColumn]
  properties:
    codeColumn:
      type: string
      minLength: 1

QuestionnaireSettlementReport:
  type: object
  additionalProperties: false
  required: [importId, questionnaireId, matchedCount, duplicateCount, unknownCount, malformedCount, alreadyAwardedCount, rewardedCount, rewardTxbMinor, settledAt, replayed]
  properties:
    importId:
      $ref: '../../openapi.yaml#/components/schemas/ID'
    questionnaireId:
      $ref: '../../openapi.yaml#/components/schemas/ID'
    matchedCount:
      type: integer
      minimum: 0
    duplicateCount:
      type: integer
      minimum: 0
    unknownCount:
      type: integer
      minimum: 0
    malformedCount:
      type: integer
      minimum: 0
    alreadyAwardedCount:
      type: integer
      minimum: 0
    rewardedCount:
      type: integer
      minimum: 0
    rewardTxbMinor:
      type: string
      pattern: '^\d+$'
    settledAt:
      $ref: '../../openapi.yaml#/components/schemas/Timestamp'
    replayed:
      type: boolean

QuestionnaireImportState:
  type: object
  additionalProperties: false
  required: [preview]
  properties:
    preview:
      $ref: '../../openapi.yaml#/components/schemas/QuestionnaireImportPreview'
    report:
      $ref: '../../openapi.yaml#/components/schemas/QuestionnaireSettlementReport'

EmbyRating:
  type: object
  additionalProperties: false
  required: [name, value]
  properties:
    name:
      type: string
    value:
      type: integer
      format: int32

EmbyLibrary:
  type: object
  additionalProperties: false
  required: [id, name]
  properties:
    id:
      type: string
    name:
      type: string

EmbyAccount:
  type: object
  additionalProperties: false
  required: [id, username, status, maxParentalRating, disabledLibraryIds, retryable, updatedAt]
  properties:
    id:
      $ref: '../../openapi.yaml#/components/schemas/ID'
    username:
      type: string
    status:
      type: string
      enum: [queued, provisioning, active, failed]
    maxParentalRating:
      type: [integer, 'null']
      format: int32
    disabledLibraryIds:
      type: array
      uniqueItems: true
      items:
        type: string
    retryable:
      type: boolean
    errorMessage:
      type: string
      description: Redacted operator-safe failure detail; absent when empty.
    updatedAt:
      $ref: '../../openapi.yaml#/components/schemas/Timestamp'
