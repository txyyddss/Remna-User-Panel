NodeCompensationConfig:
  type: object
  additionalProperties: false
  required: [enabled, thresholdMinutes, multiplierBps, revision, updatedAt]
  properties:
    enabled: { type: boolean }
    thresholdMinutes: { type: [integer, 'null'], minimum: 1, maximum: 5256000 }
    multiplierBps: { type: [integer, 'null'], minimum: 100, maximum: 1000000 }
    revision: { type: integer, minimum: 0 }
    updatedAt: { $ref: '../../openapi.yaml#/components/schemas/Timestamp' }

NodeCompensationConfigWrite:
  type: object
  additionalProperties: false
  required: [enabled, thresholdMinutes, multiplierBps, revision]
  properties:
    enabled: { type: boolean }
    thresholdMinutes: { type: [integer, 'null'], minimum: 1, maximum: 5256000 }
    multiplierBps: { type: [integer, 'null'], minimum: 100, maximum: 1000000 }
    revision: { type: integer, minimum: 0 }

NodeCompensationSquad:
  type: object
  additionalProperties: false
  required: [uuid, name]
  properties:
    uuid: { type: string, format: uuid }
    name: { type: string }

NodeCompensationEvent:
  type: object
  additionalProperties: false
  required: [id, nodeUuid, nodeName, status, offlineObservedAt, recoveredObservedAt, observedDurationSeconds,
    thresholdMinutes, multiplierBps, proposedExtensionMinutes, finalExtensionMinutes, capped, squads,
    frozenRecipientCount, eligibleRecipientCount, skippedRecipientCount, reviewedBy, reviewedAt, reviewReason,
    ineligibleReason, revision, operation]
  properties:
    id: { $ref: '../../openapi.yaml#/components/schemas/ID' }
    nodeUuid: { type: string, format: uuid }
    nodeName: { type: string }
    status: { type: string, enum: [observing, pending_review, queued, dismissed, ineligible] }
    offlineObservedAt: { $ref: '../../openapi.yaml#/components/schemas/Timestamp' }
    recoveredObservedAt: { anyOf: [{ $ref: '../../openapi.yaml#/components/schemas/Timestamp' }, { type: 'null' }] }
    observedDurationSeconds: { type: [integer, 'null'], minimum: 0 }
    thresholdMinutes: { type: integer, minimum: 1, maximum: 5256000 }
    multiplierBps: { type: integer, minimum: 100, maximum: 1000000 }
    proposedExtensionMinutes: { type: [integer, 'null'], minimum: 0, maximum: 5256000 }
    finalExtensionMinutes: { type: [integer, 'null'], minimum: 1, maximum: 5256000 }
    capped: { type: boolean }
    squads:
      type: array
      items: { $ref: '#/NodeCompensationSquad' }
    frozenRecipientCount: { type: integer, minimum: 0 }
    eligibleRecipientCount: { type: [integer, 'null'], minimum: 0 }
    skippedRecipientCount: { type: [integer, 'null'], minimum: 0 }
    reviewedBy: { type: [string, 'null'] }
    reviewedAt: { anyOf: [{ $ref: '../../openapi.yaml#/components/schemas/Timestamp' }, { type: 'null' }] }
    reviewReason: { type: [string, 'null'] }
    ineligibleReason: { type: [string, 'null'], enum: [node_disabled, below_threshold, no_recipients, computed_zero, null] }
    revision: { type: integer, minimum: 0 }
    operation: { anyOf: [{ $ref: '../../openapi.yaml#/components/schemas/OperationReceipt' }, { type: 'null' }] }

NodeCompensationEventPage:
  type: object
  additionalProperties: false
  required: [items, nextCursor]
  properties:
    items:
      type: array
      items: { $ref: '#/NodeCompensationEvent' }
    nextCursor: { type: [string, 'null'] }

NodeCompensationApproval:
  type: object
  additionalProperties: false
  required: [revision, extensionMinutes, reason]
  properties:
    revision: { type: integer, minimum: 0 }
    extensionMinutes: { type: integer, minimum: 1, maximum: 5256000 }
    reason: { type: string, minLength: 3, maxLength: 500 }

NodeCompensationDismissal:
  type: object
  additionalProperties: false
  required: [revision, reason]
  properties:
    revision: { type: integer, minimum: 0 }
    reason: { type: string, minLength: 3, maxLength: 500 }

AbusePolicy:
  type: object
  additionalProperties: false
  required: [globalEnabled, globalLimit, streakSeconds, warningValidityDays, warningCooldownMinutes, revision]
  properties:
    globalEnabled: { type: boolean }
    globalLimit: { type: integer, minimum: 0, maximum: 100000 }
    streakSeconds: { type: integer, minimum: 1, maximum: 1800 }
    warningValidityDays: { type: integer, minimum: 1, maximum: 365 }
    warningCooldownMinutes: { type: integer, minimum: 0, maximum: 525600 }
    revision: { type: integer, minimum: 0 }

AbuseRecord:
  type: object
  additionalProperties: false
  required: [id, occurredAt, reason, measuredQPS, qpsLimit, action]
  properties:
    id: { $ref: '../../openapi.yaml#/components/schemas/ID' }
    username: { type: string, maxLength: 120 }
    occurredAt: { $ref: '../../openapi.yaml#/components/schemas/Timestamp' }
    reason: { type: string, maxLength: 1024 }
    measuredQPS: { type: integer, minimum: 0 }
    qpsLimit: { type: integer, minimum: 1, maximum: 100000 }
    action: { type: string, enum: [warning, ip_ban, subscription_revoke, temporary_ban] }
    expiresAt: { $ref: '../../openapi.yaml#/components/schemas/Timestamp' }

AbuseRecordPage:
  type: object
  additionalProperties: false
  required: [items, nextCursor]
  properties:
    items: { type: array, items: { $ref: '#/AbuseRecord' } }
    nextCursor: { type: string, maxLength: 512 }
