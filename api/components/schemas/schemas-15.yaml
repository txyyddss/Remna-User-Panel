RenewalRequest:
  type: object
  additionalProperties: false
  required: [termCount]
  properties:
    termCount:
      type: integer
      minimum: 1
      maximum: 6

RenewalQuote:
  type: object
  additionalProperties: false
  required: [purchaseId, comboId, termCount, pricePerTerm, totalPrice, effectiveAt, expiresAt, addonSquadUuids, accessibleNodes]
  properties:
    purchaseId: { $ref: '../../openapi.yaml#/components/schemas/ID' }
    comboId: { $ref: '../../openapi.yaml#/components/schemas/ID' }
    termCount: { type: integer, minimum: 1, maximum: 6 }
    pricePerTerm: { $ref: '../../openapi.yaml#/components/schemas/Money' }
    totalPrice: { $ref: '../../openapi.yaml#/components/schemas/Money' }
    effectiveAt: { $ref: '../../openapi.yaml#/components/schemas/Timestamp' }
    expiresAt: { $ref: '../../openapi.yaml#/components/schemas/Timestamp' }
    addonSquadUuids:
      type: array
      uniqueItems: true
      items: { type: string, format: uuid }
    accessibleNodes:
      type: array
      items: { $ref: '../../openapi.yaml#/components/schemas/RemnaNode' }

RenewalBatch:
  type: object
  additionalProperties: false
  required: [id, purchaseId, termCount, totalPrice, purchases]
  properties:
    id: { $ref: '../../openapi.yaml#/components/schemas/ID' }
    purchaseId: { $ref: '../../openapi.yaml#/components/schemas/ID' }
    termCount: { type: integer, minimum: 1, maximum: 6 }
    totalPrice: { $ref: '../../openapi.yaml#/components/schemas/Money' }
    purchases:
      type: array
      items: { $ref: '../../openapi.yaml#/components/schemas/Purchase' }

PaymentProfile:
  type: object
  additionalProperties: false
  required: [id, provider, providerName, enabledChannels, endpoint, merchantId, credential, acknowledgement, enabled, configured]
  properties:
    id: { type: string }
    provider: { type: string, enum: [ezpay, bepusdt] }
    providerName: { type: string, minLength: 1, maxLength: 80 }
    enabledChannels:
      type: array
      items: { type: string }
    endpoint: { type: string, format: uri }
    merchantId: { type: string }
    credential: { type: string, description: Masked write-only credential. }
    acknowledgement: { type: string }
    enabled: { type: boolean }
    configured: { type: boolean }

PaymentProfileWrite:
  type: object
  additionalProperties: false
  required: [provider, providerName, enabledChannels, endpoint, enabled]
  properties:
    id: { type: string }
    provider: { type: string, enum: [ezpay, bepusdt] }
    providerName: { type: string, minLength: 1, maxLength: 80 }
    enabledChannels:
      type: array
      items: { type: string }
    endpoint: { type: string, format: uri }
    merchantId: { type: string }
    credential: { type: string, description: Leave blank to retain the masked credential. }
    acknowledgement: { type: string }
    enabled: { type: boolean }
