RolloverWindow:
  type: object
  additionalProperties: false
  required:
    - start
    - end
    - allocatedTrafficBytes
    - usedTrafficBytes
    - remainingTrafficBytes
    - eligibleUnusedBytes
    - rollover
  properties:
    start: { $ref: '../../openapi.yaml#/components/schemas/Timestamp' }
    end: { $ref: '../../openapi.yaml#/components/schemas/Timestamp' }
    allocatedTrafficBytes: { $ref: '../../openapi.yaml#/components/schemas/DecimalInteger' }
    usedTrafficBytes: { $ref: '../../openapi.yaml#/components/schemas/DecimalInteger' }
    remainingTrafficBytes: { $ref: '../../openapi.yaml#/components/schemas/DecimalInteger' }
    eligibleUnusedBytes: { $ref: '../../openapi.yaml#/components/schemas/DecimalInteger' }
    rollover: { $ref: '../../openapi.yaml#/components/schemas/Money' }

RolloverProjection:
  type: object
  additionalProperties: false
  required: [purchaseId, paid, autoRenewalEnabled, warningCode, actualUsedTrafficBytes, projectedFullTermUsageBytes, maximumAllowableUsageBytes, maximumDailyUsageBytes, predictedRollover, requiredReductionBytes, requiredDailyReductionBytes, minimumRemainingBps, term, lastResetPeriod, fetchedAt]
  properties:
    purchaseId: { $ref: '../../openapi.yaml#/components/schemas/ID' }
    paid:
      allOf:
        - $ref: '../../openapi.yaml#/components/schemas/Money'
      description: Actual net TXB charged for this purchase term after discounts.
    autoRenewalEnabled: { type: boolean }
    warningCode: { type: [string, 'null'] }
    actualUsedTrafficBytes: { type: [string, 'null'], pattern: '^\d+$' }
    projectedFullTermUsageBytes: { type: [string, 'null'], pattern: '^\d+$' }
    maximumAllowableUsageBytes: { type: [string, 'null'], pattern: '^\d+$' }
    maximumDailyUsageBytes: { type: [string, 'null'], pattern: '^\d+$' }
    predictedRollover:
      oneOf:
        - $ref: '../../openapi.yaml#/components/schemas/Money'
        - type: 'null'
    requiredReductionBytes: { type: [string, 'null'], pattern: '^\d+$' }
    requiredDailyReductionBytes: { type: [string, 'null'], pattern: '^\d+$' }
    minimumRemainingBps: { type: integer, minimum: 0, maximum: 10000 }
    term:
      oneOf:
        - $ref: '../../openapi.yaml#/components/schemas/RolloverWindow'
        - type: 'null'
    lastResetPeriod:
      oneOf:
        - $ref: '../../openapi.yaml#/components/schemas/RolloverWindow'
        - type: 'null'
    fetchedAt: { $ref: '../../openapi.yaml#/components/schemas/Timestamp' }
