      required: [order_id, amount, actual_amount, token, status]
      properties:
        trade_id:
          type: string
        order_id:
          type: string
        amount:
          $ref: '#/components/schemas/FlexibleDecimal'
        actual_amount:
          $ref: '#/components/schemas/FlexibleDecimal'
        token:
          type: string
        block_transaction_id:
          type: string
        status:
          type: integer
          enum: [1, 2, 3]
        created_at:
          type: string
        expired_at:
          type: string

    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
