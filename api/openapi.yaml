                  type: string
                provider_payment_charge_id:
                  type: string
            refunded_payment:
              type: object
              additionalProperties: true
              properties:
                currency:
                  type: string
                  const: XTR
                total_amount:
                  type: integer
                invoice_payload:
                  type: string
                telegram_payment_charge_id:
                  type: string
                provider_payment_charge_id:
                  type: string

