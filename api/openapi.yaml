openapi: 3.1.0
info:
  title: TX Carpool API
  version: 1.0.0
  description: |
    HTTP contract for the TX Carpool Telegram Mini App. User and admin endpoints
    use a Secure, HttpOnly session cookie established from validated Telegram
    Mini App `initData`. Provider callbacks use provider-specific signatures and
    are never authenticated by the browser session.

    All identifiers and timestamps are strings. TXB values use integer hundredths
    encoded as decimal strings. Traffic byte counts are decimal strings. The
    server is authoritative for prices, exchange rates, entitlement dates, and
    payment state.
  license:
    name: Proprietary
servers:
  - url: /
    description: Same-origin API
tags:
  - name: Authentication
  - name: Onboarding
  - name: Dashboard
  - name: Catalog
  - name: Billing
  - name: Activity
  - name: Coupons
  - name: Questionnaires
  - name: Emby
  - name: Admin
  - name: Database Administration
  - name: Webhooks
  - name: Operations
security:
  - cookieSession: []

paths:
  /api/v1/auth/telegram:
    post:
      tags: [Authentication]
      operationId: authenticateTelegram
      summary: Exchange Telegram Mini App init data for a session
      description: |
        Validates the raw query string according to Telegram's Mini App algorithm,
        rejects `auth_date` older than five minutes, upserts the Telegram identity,
        and sets a seven-day Secure, HttpOnly, SameSite session cookie. Data from
        `initDataUnsafe` is never accepted.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramAuthRequest'
      responses:
        '200':
          description: Authenticated; the session cookie is set.
          headers:
            Set-Cookie:
              description: Opaque session cookie. Its value is never exposed to JavaScript.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/me:
    get:
      tags: [Authentication]
      operationId: getMe
      summary: Get the current identity and onboarding state
      responses:
        '200':
          description: Current authenticated state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthState'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/onboarding/invites:
    post:
      tags: [Onboarding]
      operationId: createOnboardingInvites
      summary: Create identity-bound group and channel join-request links
      description: |
        Creates or replaces 30-minute join-request links for the authenticated
        Telegram identity. Only that identity may be approved. Links are revoked
        after approval or replacement.
      responses:
        '200':
          description: Active one-time join-request links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingInvites'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/onboarding/membership/check:
    post:
      tags: [Onboarding]
      operationId: checkOnboardingMembership
      summary: Recheck canonical group and channel membership
      description: Calls Telegram `getChatMember` for both configured chats and advances onboarding only when both memberships are valid.
      responses:
        '200':
          description: Refreshed canonical membership and user state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamFailure'

  /api/v1/onboarding/username:
    put:
      tags: [Onboarding]
      operationId: reserveUsername
      summary: Reserve the immutable service username
      description: |
        Accepts only `^[a-z]{3,9}$`. The service checks local uniqueness, performs
        a Remnawave preflight, and also treats Remnawave `A019` as a duplicate if
        the upstream race is lost.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsernameRequest'
      responses:
        '200':
          description: Username reserved and onboarding advanced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/onboarding/agreement:
    post:
      tags: [Onboarding]
      operationId: acceptSharingAgreement
      summary: Accept the no-sharing agreement and provision Remnawave
      description: |
        Records acceptance and ensures an ACTIVE Remnawave user with a 2099
        upstream expiry, zero traffic, NO_RESET, and no squads. Recoverable partial
        failures remain resumable and are reconciled by username and Telegram ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgreementRequest'
      responses:
        '200':
          description: Agreement accepted and onboarding complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/UpstreamFailure'

  /api/v1/dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Get the current home-page projection
      description: Returns balance, active and queued purchases, subscription data, and cached Remnawave statistics. `statisticsStale` is true when cached statistics were used after an upstream failure.
      responses:
        '200':
          description: Dashboard projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
  /api/v1/catalog:
    get:
      tags: [Catalog]
      operationId: getCatalog
      summary: List purchasable combos and add-on squads
      responses:
        '200':
          description: Current visible catalog. The server will recalculate all prices at purchase time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalFailure'

  /api/v1/purchases:
    get:
      tags: [Catalog]
      operationId: listPurchases
      summary: List the current user's purchase history
      responses:
        '200':
          description: Purchases newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Purchase'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalFailure'
    post:
      tags: [Catalog]
      operationId: createPurchase
      summary: Purchase or renew a combo with optional squads
      description: |
        Prices are loaded from the current catalog and debited atomically from the
        TXB ledger. First purchases activate immediately, same-plan renewals extend
        from the later of now or current expiry, and plan/add-on changes queue for
        the current term boundary. No proration is performed. Repeating the same
        caller-owned idempotency key returns the original purchase without another debit.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseRequest'
      responses:
        '201':
          description: Purchase was created and its Remnawave operation was queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Insufficient balance, outstanding debt, stale catalog choice, or incompatible queued change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/subscription/revoke:
    post:
      tags: [Dashboard]
      operationId: revokeSubscription
      summary: Rotate the current Remnawave subscription URL
      description: Calls Remnawave revoke with `revokeOnlyPasswords:false`. The old URL must be treated as invalid after success.
      responses:
        '200':
          description: Rotated subscription reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionRotation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamFailure'

  /api/v1/balance:
    get:
      tags: [Billing]
      operationId: getBalance
      summary: Get current TXB balance
      responses:
        '200':
          description: Current ledger-derived balance and enabled-provider availability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalFailure'

  /api/v1/ledger:
    get:
      tags: [Billing]
      operationId: listLedgerEntries
      summary: List the current user's immutable TXB ledger
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Ledger entries newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalFailure'

  /api/v1/payments/orders:
    post:
      tags: [Billing]
      operationId: createPaymentOrder
      summary: Create a balance top-up order
      description: |
        The requested TXB minor units are divided by the required `txb_per_cny`,
        `txb_per_usd`, or `txb_per_xtr` fixed-decimal rate and rounded upward at
        provider precision. A successful authoritative callback credits exactly
        `txbMinor`. At most 200 durable orders are retained; only terminal evidence
        is pruned before creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentOrderRequest'
      responses:
        '201':
          description: Durable payment order with separate URL, QR, receiving-address, and actual-crypto fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Method unavailable or all 200 retained orders are currently non-prunable. Capacity conflicts are retryable.
          headers:
            Retry-After:
              schema:
                type: string
                pattern: '^\d+$'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '502':
          $ref: '#/components/responses/UpstreamFailure'

  /api/v1/payments/orders/{id}:
    get:
      tags: [Billing]
      operationId: getPaymentOrder
      summary: Poll durable payment state
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Current authoritative order state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/payments/orders/{id}/cancel:
    post:
      tags: [Billing]
      operationId: cancelPaymentOrder
      summary: Cancel a user-owned unpaid payment order
      description: |
        Stops client polling, records a local cancellation, and asks BEPusdt to
        cancel the direct transaction when that provider supports it. A later
        authoritative paid event may still settle and credit the order exactly once.
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Current order state after the cancellation attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/emby/account:
    get:
      tags: [Emby]
      operationId: getEmbyAccount
      summary: Get setup choices and the current linked Emby account
      responses:
        '200':
          description: Server-priced setup state plus choices fetched from Emby.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbyOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamFailure'

  /api/v1/emby/setup:
    post:
      tags: [Emby]
      operationId: setupEmbyAccount
      summary: Debit and queue durable Emby provisioning
      description: The password is write-only, encrypted for the provisioning saga, and erased after terminal completion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbySetupRequest'
      responses:
        '202':
          description: Setup was debited atomically and queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbyAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/emby/preferences:
    put:
      tags: [Emby]
      operationId: updateEmbyPreferences
      summary: Replace the allowed Emby rating and library preferences
      description: The server fetches the current upstream policy and overlays only approved preference fields plus mandatory restrictions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbyPreferencesRequest'
      responses:
        '200':
          description: Updated safe account projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbyAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '502':
          $ref: '#/components/responses/UpstreamFailure'

  /api/v1/emby/password:
    put:
      tags: [Emby]
      operationId: changeEmbyPassword
      summary: Change the linked Emby password synchronously
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbyPasswordRequest'
      responses:
        '204':
          description: Password changed; plaintext is not returned or retained.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '502':
          $ref: '#/components/responses/UpstreamFailure'

  /api/v1/activity:
    get:
      tags: [Activity]
      operationId: getActivityOverview
      summary: Get daily check-in, games, draws, and recent results
      responses:
        '200':
          description: Current server-configured Activity state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/activity/check-ins:
    post:
      tags: [Activity]
      operationId: checkInActivity
      summary: Claim the configured reward once per local calendar day
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: New or replayed daily check-in result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/activity/bets:
    post:
      tags: [Activity]
      operationId: playActivityGame
      summary: Debit a stake and record a cryptographically selected result
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityBetRequest'
      responses:
        '201':
          description: Immutable bet result with its balance projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/activity/draws:
    post:
      tags: [Activity]
      operationId: playLuckyDraw
      summary: Pay the configured fee and apply one weighted prize atomically
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityDrawRequest'
      responses:
        '201':
          description: Immutable draw result and typed reward.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/coupons/wallet:
    get:
      tags: [Coupons]
      operationId: getCouponWallet
      summary: List the current user's coupon grants
      responses:
        '200':
          description: Coupon grants available or retained for history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponGrantList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/coupons/redeem:
    post:
      tags: [Coupons]
      operationId: redeemCoupon
      summary: Redeem one canonical coupon code
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponRedeemRequest'
      responses:
        '200':
          description: Idempotent redemption, wallet grant, or immediate balance effect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponRedemption'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/questionnaires/active:
    get:
      tags: [Questionnaires]
      operationId: getActiveQuestionnaire
      summary: Get the single active questionnaire and durable validation code
      responses:
        '200':
          description: Active questionnaire, or JSON null when none is active.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ActiveQuestionnaire'
                  - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/questionnaires/history:
    get:
      tags: [Questionnaires]
      operationId: getQuestionnaireHistory
      summary: List this user's questionnaire participations
      responses:
        '200':
          description: Questionnaire and validation-code history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionnaireHistoryList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/questionnaires/{id}/participation:
    post:
      tags: [Questionnaires]
      operationId: participateInQuestionnaire
      summary: Create or retrieve this user's durable validation code
      parameters:
        - $ref: '#/components/parameters/ResourceID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Existing or newly created participant record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionnaireParticipation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/admin/activity-settings:
    get:
      tags: [Admin, Activity]
      operationId: getAdminActivitySettings
      summary: Get local-day and daily-reward settings
      responses:
        '200':
          description: Current Activity settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivitySettings'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Admin, Activity]
      operationId: updateAdminActivitySettings
      summary: Replace local-day and daily-reward settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivitySettingsWrite'
      responses:
        '200':
          description: Updated Activity settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivitySettings'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/admin/activity-games:
    get:
      tags: [Admin, Activity]
      operationId: listAdminActivityGames
      summary: List all configured betting games
      responses:
        '200':
          description: Enabled and disabled games.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityGameList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin, Activity]
      operationId: createAdminActivityGame
      summary: Create a betting game
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityGameWrite'
      responses:
        '201':
          description: Created game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityGame'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/admin/activity-games/{id}:
    put:
      tags: [Admin, Activity]
      operationId: updateAdminActivityGame
      summary: Replace a betting-game definition
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityGameWrite'
      responses:
        '200':
          description: Updated game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityGame'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/admin/lucky-draw:
    get:
      tags: [Admin, Activity]
      operationId: listAdminLuckyDraws
      summary: List lucky draws and weighted prizes
      responses:
        '200':
          description: Enabled and disabled draw definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LuckyDrawAdminList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin, Activity]
      operationId: createAdminLuckyDraw
      summary: Create a lucky draw and its typed rewards
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LuckyDrawWrite'
      responses:
        '201':
          description: Created draw.
          content:
