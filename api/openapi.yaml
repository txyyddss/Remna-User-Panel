openapi: 3.1.0
info:
  title: TX Carpool API
  version: 1.0.0
  description: |
    HTTP contract for the TX Carpool Telegram Mini App. User and admin endpoints use a Secure, HttpOnly session cookie established from validated Telegram Mini App `initData`.
    Every authenticated browser request also carries a five-minute HMAC timestamp, unique nonce, and signature derived from a
    same-origin companion key. Provider callbacks use provider-specific
    signatures and are never authenticated by the browser session.
    All identifiers and timestamps are strings. TXB values use integer hundredths
    encoded as decimal strings. Traffic byte counts are decimal strings. The
    server is authoritative for prices, exchange rates, entitlement dates, and
    payment state.
  license: { name: Proprietary }
servers: [{ url: /, description: Same-origin API }]
tags: [{ name: Authentication }, { name: Onboarding }, { name: Dashboard }, { name: Catalog }, { name: Billing }, { name: Activity }, { name: Coupons }, { name: Questionnaires }, { name: Emby }, { name: Admin }, { name: Database Administration }, { name: Webhooks }, { name: Operations }]
security: [{ cookieSession: [], requestTimestamp: [], requestNonce: [], requestSignature: [] }]
