        - status
        - trafficLimitBytes
        - resetStrategy
        - squadUuids
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/ID'
        userId:
          $ref: '#/components/schemas/ID'
        comboId:
          $ref: '#/components/schemas/ID'
        comboName:
          type: string
        price:
