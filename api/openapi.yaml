        trafficLimitBytes:
          type: string
          pattern: '^\d+$'
        resetStrategy:
          $ref: '#/components/schemas/ResetStrategy'
        squadUuids:
          type: array
          items:
            type: string
            format: uuid
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    PaymentPage:
