          $ref: '#/components/responses/Unprocessable'
        '502':
          $ref: '#/components/responses/UpstreamFailure'

  /api/v1/admin/refunds:
    get:
      tags: [Admin]
      operationId: listAdminRefunds
      summary: List immutable refund records
      responses:
        '200':
          description: Refund page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/database/tables:
    get:
      tags: [Admin, Database Administration]
      operationId: listAdminDatabaseTables
      summary: List allowlisted application tables and typed columns
      description: Excludes `schema_migrations` and SQLite internal tables. Direct edits bypass domain synchronization hooks.
      responses:
        '200':
          description: Schema-aware editable table catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseTableList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/database/tables/{table}/rows:
    get:
      tags: [Admin, Database Administration]
      operationId: listAdminDatabaseRows
      summary: Page typed rows by declared primary key or rowid
      parameters:
        - $ref: '#/components/parameters/DatabaseTableName'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/DatabasePageLimit'
      responses:
        '200':
          description: Typed rows with optimistic hashes and a continuation cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseRowPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Admin, Database Administration]
      operationId: updateAdminDatabaseRowCompatibility
      summary: Apply a previously reviewed update through the compatibility route
      description: One-step writes are refused. The review hash and typed confirmation must match a live review.
      parameters:
        - $ref: '#/components/parameters/DatabaseTableName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseCompatibilityUpdate'
      responses:
        '200':
          description: Updated typed row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseRow'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/admin/database/mutations/review:
    post:
      tags: [Admin, Database Administration]
      operationId: reviewAdminDatabaseMutation
      summary: Review a typed database mutation and its redacted diff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseMutationReviewRequest'
      responses:
        '200':
          description: Redacted before/after diff and exact typed confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseMutationReview'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/admin/database/mutations:
    post:
      tags: [Admin, Database Administration]
      operationId: applyAdminDatabaseMutation
      summary: Apply an exact reviewed mutation after a rescue backup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseMutationApplyRequest'
      responses:
        '200':
          description: Mutation result and automatic rescue-backup identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseMutationResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalFailure' }

  /api/v1/admin/backups:
    get:
      tags: [Admin, Database Administration]
      operationId: listAdminBackups
      summary: List verified online database backups
      responses:
        '200':
          description: Backup runs newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/BackupRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin, Database Administration]
      operationId: createAdminBackup
      summary: Run and verify an online SQLite backup now
      responses:
        '201':
          description: Backup completed and verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/admin/backups/{id}/download:
    get:
      tags: [Admin, Database Administration]
      operationId: downloadAdminBackup
      summary: Download an authenticated verified SQLite snapshot
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Streamed SQLite database snapshot.
          headers:
            Content-Disposition:
              required: true
              schema:
                type: string
                pattern: '^attachment;'
            Content-Length:
              required: true
              schema:
                type: string
                pattern: '^\d+$'
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
            X-Content-Type-Options:
              required: true
              schema:
                type: string
                const: nosniff
          content:
            application/vnd.sqlite3:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/backups/{id}/restore:
    post:
      tags: [Admin, Database Administration]
      operationId: stageAdminRestore
      summary: Verify and stage a stored snapshot for restart-time restore
      description: Creates a rescue backup, verifies integrity and migration compatibility, stages beside the live database, writes a restore marker, and requests graceful restart.
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
      responses:
        '202':
          description: Restore staged; clients should reconnect, reauthenticate, and poll status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreOperation'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalFailure' }

  /api/v1/admin/restores/{id}:
    get:
      tags: [Admin, Database Administration]
      operationId: getAdminRestoreStatus
      summary: Get staged restore and rollback status
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Current safe restore projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreOperation'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/jobs:
    get:
      tags: [Admin]
      operationId: listAdminJobs
      summary: List persistent outbox and scheduler jobs
      responses:
        '200':
          description: Job page. Secret payload fields are redacted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/jobs/{id}/retry:
    post:
      tags: [Admin]
      operationId: retryAdminJob
      summary: Make a failed retryable job available now
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '204':
          description: Job scheduled for retry.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/admin/audit-events:
    get:
      tags: [Admin]
      operationId: listAdminAuditEvents
      summary: List immutable administrative audit events
      responses:
        '200':
          description: Audit page. Events cannot be updated or deleted through the API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/webhooks/telegram:
    post:
      tags: [Webhooks]
      operationId: receiveTelegramWebhook
      summary: Receive Telegram bot updates
      description: Validates the configured Telegram webhook secret header. Relevant join requests, chat-member updates, pre-checkout queries, and successful payments are processed idempotently.
      security: []
      parameters:
        - name: X-Telegram-Bot-Api-Secret-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramUpdate'
      responses:
        '204':
          description: Update accepted or already processed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalFailure'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/webhooks/ezpay:
    get:
      tags: [Webhooks]
      operationId: receiveEZPayWebhook
      summary: Receive the signed EZPay asynchronous notification
      description: Only a valid signature, `TRADE_SUCCESS`, known order/provider trade, and exact payable amount can credit TXB. Replayed notifications are acknowledged without a second credit.
      security: []
      parameters:
        - name: pid
          in: query
          required: true
          schema: { type: string }
        - name: trade_no
          in: query
          required: true
          schema: { type: string }
        - name: out_trade_no
          in: query
          required: true
          schema: { type: string }
        - name: type
          in: query
          required: true
          description: Signed rail subtype; it must equal the immutable order snapshot.
          schema:
            type: string
            enum: [alipay, wxpay, qqpay, bank, jdpay]
        - name: name
          in: query
          required: false
          schema: { type: string }
        - name: money
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d+(\.\d{1,2})?$'
        - name: trade_status
          in: query
          required: true
          schema:
            type: string
            enum: [TRADE_SUCCESS]
        - name: sign
          in: query
          required: true
          schema: { type: string }
        - name: sign_type
          in: query
          required: true
          schema:
            type: string
            enum: [MD5]
      responses:
        '200':
          description: Plain-text `success` for a valid notification, including an idempotent replay.
          content:
            text/plain:
              schema:
                type: string
                const: success
        '400':
          description: Signature or notification validation failed.
          content:
            text/plain:
              schema:
                type: string
                const: fail
        '409':
          description: The signed payment did not match durable order state.
          content:
            text/plain:
              schema:
                type: string
                const: fail

  /api/v1/webhooks/bepusdt:
    post:
      tags: [Webhooks]
      operationId: receiveBEPusdtWebhook
      summary: Receive a signed BEPusdt transaction notification
      description: |
        Status `2` is the only crediting state. Signature, local order, provider trade ID,
        requested USD amount, and actual crypto amount are checked before the idempotent
        ledger transaction. When the callback's overloaded `token` field carries a receiving
        address, it must exactly match the checkout address; the reference-compatible literal
        `USDT` token is treated as a currency marker. Status `3` is validated against the same
        durable order snapshot before the order is marked expired.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BEPusdtNotification'
      responses:
        '200':
          description: Configured plain-text acknowledgement; defaults to `ok` and may be `success`.
          content:
            text/plain:
              schema:
                type: string
                enum: [ok, success]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/webhooks/bepusdt/{capability}:
    post:
      tags: [Webhooks]
      operationId: receiveBEPusdtCapabilityWebhook
      summary: Receive a BEPusdt notification authenticated by signature or per-order capability
      description: |
        Signed notifications retain normal signature validation. Unsigned v1.19
        notifications are accepted only when the unguessable HMAC capability in
        this callback URL matches the stored order. Capabilities are redacted from logs.
      security: []
      parameters:
        - name: capability
          in: path
          required: true
          schema:
            type: string
            minLength: 32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/BEPusdtNotification'
                - $ref: '#/components/schemas/BEPusdtUnsignedNotification'
      responses:
        '200':
          description: Configured plain-text acknowledgement, either `ok` or `success`.
          content:
            text/plain:
              schema:
                type: string
                enum: [ok, success]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/payments/return/{provider}:
    get:
      tags: [Billing]
      operationId: returnFromPaymentProvider
      summary: Navigate back to the Mini App after provider checkout
      description: This route never credits balance. It redirects to the client order screen, which polls durable webhook-confirmed state.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [ezpay, bepusdt]
      responses:
        '303':
          description: Redirect to the same-origin payment result route.
          headers:
            Location:
              required: true
              schema:
                type: string

  /api/v1/payments/return/{provider}/{orderID}:
    get:
      tags: [Billing]
      operationId: returnFromPaymentProviderWithOrder
      summary: Navigate back to a specific Mini App payment order
      description: Compatibility return route for providers that preserve path parameters more reliably than query parameters. It never credits balance.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [ezpay, bepusdt]
        - name: orderID
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ID'
      responses:
        '303':
          description: Redirect to the same-origin payment result route.
          headers:
            Location:
              required: true
              schema:
                type: string

  /healthz:
    get:
      tags: [Operations]
      operationId: getLiveness
      summary: HTTP and local database liveness
      security: []
      responses:
        '200':
          description: The process can serve HTTP and SQLite responds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: The process is serving HTTP but SQLite is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /readyz:
    get:
      tags: [Operations]
      operationId: getReadiness
      summary: Database and setup readiness
      description: Returns 503 until the database is usable and required chat, Remnawave, exchange-rate, and catalog configuration is complete.
      security: []
      responses:
        '200':
          description: Ready to serve the complete product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeReadiness'
        '503':
          description: Alive but not fully configured or a required local dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeReadiness'

components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: txc_session
      description: Opaque seven-day session created only by validated Telegram Mini App init data.

  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ImportID:
      name: importID
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    DatabaseTableName:
      name: table
      in: path
      required: true
      description: Exact name from the server-provided allowlisted table catalog.
      schema:
        type: string
        pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-owned semantic idempotency reference.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Caller-owned semantic idempotency reference; the server generates one when omitted.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    SettingKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_.-]{1,63}$'
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the preceding page.
      schema:
        type: string
    PageSize:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    DatabasePageLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing, invalid, or expired authentication or provider signature.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: The authenticated identity cannot perform this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource not found or not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Request conflicts with current persisted state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unprocessable:
      description: The JSON shape was valid, but one or more domain values failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalFailure:
      description: A required local operation failed unexpectedly.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UpstreamFailure:
      description: A required provider could not complete the synchronous portion of the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: A required service or deployment setting is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ID:
      type: string
      minLength: 1
      examples: [01JZX6BKW16M0CNQ5Q74K8DN7J]

    Timestamp:
      type: string
      format: date-time
      examples: ['2026-08-07T10:00:00Z']

    DecimalInteger:
      type: string
      pattern: '^-?\d+$'
      examples: ['1250']

    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          examples: [INSUFFICIENT_BALANCE]
        message:
          type: string
        details:
          type: object
          additionalProperties:
            type: string
        requestId:
          type: string
          minLength: 1

    TelegramAuthRequest:
      type: object
      additionalProperties: false
      required: [initData]
      properties:
        initData:
          type: string
          minLength: 1
          description: Raw `Telegram.WebApp.initData` query string.

    OnboardingStep:
      type: string
      enum: [intro, membership, username, agreement, complete]

    User:
      type: object
      additionalProperties: false
      required:
        - id
        - telegramId
        - firstName
        - lastName
        - telegramUsername
        - username
        - role
        - onboardingState
        - groupJoined
        - channelJoined
        - policyAcceptedAt
        - recoveryReason
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/ID'
        telegramId:
          type: string
          pattern: '^\d+$'
        firstName:
          type: string
        lastName:
          type: string
        telegramUsername:
          type: string
        username:
          type: [string, 'null']
          pattern: '^[a-z]{3,9}$'
        role:
          type: string
          enum: [user, admin]
        onboardingState:
          $ref: '#/components/schemas/OnboardingStep'
        groupJoined:
          type: boolean
        channelJoined:
          type: boolean
        policyAcceptedAt:
          type: [string, 'null']
          format: date-time
        recoveryReason:
          type: string
          enum: ['', remnawave_user_missing]
          description: Non-empty only while confirmed linked-user recovery onboarding is required.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    AuthState:
      type: object
      additionalProperties: false
      required: [authenticated, user]
      properties:
        authenticated:
          type: boolean
          const: true
        user:
          $ref: '#/components/schemas/User'

    JoinInvite:
      type: object
      additionalProperties: false
      required: [url, expiresAt]
      properties:
        url:
          type: string
          format: uri
        expiresAt:
          $ref: '#/components/schemas/Timestamp'

    OnboardingInvites:
      type: object
      additionalProperties: false
      required: [group, channel]
      properties:
        group:
          $ref: '#/components/schemas/JoinInvite'
        channel:
          $ref: '#/components/schemas/JoinInvite'

    MembershipState:
      type: object
      additionalProperties: false
      required: [groupJoined, channelJoined, complete, user]
      properties:
        groupJoined:
          type: boolean
        channelJoined:
          type: boolean
        complete:
          type: boolean
        user:
          $ref: '#/components/schemas/User'

    UsernameRequest:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          type: string
          pattern: '^[a-z]{3,9}$'

    AgreementRequest:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted:
          type: boolean
          const: true

    Money:
      type: object
      additionalProperties: false
      required: [currency, minor, display]
      description: Integer minor units. TXB, CNY, and USD use scale 2; XTR uses scale 0.
      properties:
