          type: string
          enum: [CNY, USD, XTR, USDT]
        rateSnapshot:
          type: string
        paymentUrl:
          type: [string, 'null']
          format: uri
        qrPayload:
          type: [string, 'null']
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        paidAt:
          type: [string, 'null']
          format: date-time
        refundedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

