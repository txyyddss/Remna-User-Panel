      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminPaymentOrder'
        page:
          $ref: '#/components/schemas/PageInfo'

    AdminPaymentOrder:
      type: object
      additionalProperties: false
      required:
        - id
        - userId
        - provider
        - status
        - txb
        - payableAmount
        - payableCurrency
        - rateSnapshot
        - paymentUrl
        - qrPayload
        - expiresAt
        - paidAt
        - refundedAt
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/ID'
        userId:
          $ref: '#/components/schemas/ID'
        provider:
