        reason:
          type: string
          minLength: 3
          maxLength: 500
        reviewHash:
          type: string
          minLength: 32
        confirmation:
          type: string
          minLength: 1

    DatabaseCompatibilityUpdate:
      type: object
      additionalProperties: false
      required: [key, values, recordHash, reason, reviewHash, confirmation]
      properties:
        key:
          $ref: '#/components/schemas/DatabaseKey'
        values:
          $ref: '#/components/schemas/DatabaseValues'
        recordHash:
          type: string
        reason:
          type: string
          minLength: 3
          maxLength: 500
        reviewHash:
          type: string
          minLength: 32
        confirmation:
          type: string
          minLength: 1

    DatabaseMutationReview:
      type: object
      additionalProperties: false
      required: [action, table, changedColumns, reviewHash, requiredConfirmation, rescueBackupRequired, warning]
      properties:
        action:
          $ref: '#/components/schemas/DatabaseMutationAction'
        table:
          type: string
        key:
          $ref: '#/components/schemas/DatabaseKey'
        before:
          $ref: '#/components/schemas/DatabaseValues'
        after:
          $ref: '#/components/schemas/DatabaseValues'
        changedColumns:
          type: array
          items:
            type: string
        reviewHash:
          type: string
        requiredConfirmation:
          type: string
          description: Exact phrase the administrator must type, such as `EDIT users`.
        rescueBackupRequired:
          type: boolean
          const: true
        warning:
          type: string

    DatabaseMutationResult:
      type: object
      additionalProperties: false
      required: [deleted, rescueBackupId]
      properties:
        row:
          $ref: '#/components/schemas/DatabaseRow'
        deleted:
          type: boolean
        rescueBackupId:
          $ref: '#/components/schemas/ID'

    RestoreRequest:
      type: object
      additionalProperties: false
      required: [reason, confirmation]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
        confirmation:
          type: string
          minLength: 1
          description: Exact `RESTORE <filename>` phrase shown during review.

    RestoreOperation:
      type: object
      additionalProperties: false
      required: [id, backupId, status, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        backupId:
          $ref: '#/components/schemas/ID'
        status:
          type: string
          enum: [staging, restarting, complete, failed]
        error:
          type: string
          description: Redacted recovery guidance; present only for failed restores.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    BackupRun:
      type: object
      additionalProperties: false
      required: [id, path, sizeBytes, status, error, createdAt, completedAt]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        path:
          type: string
        sizeBytes:
          type: string
          pattern: '^\d+$'
        status:
          type: string
          enum: [running, complete, failed]
        error:
          type: string
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        completedAt:
          type: [string, 'null']
          format: date-time

    JobStatus:
      type: string
      enum: [pending, processing, done, failed]

    Job:
      type: object
      additionalProperties: false
      required: [id, kind, aggregateId, payload, status, attempts, availableAt, lastError, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        kind:
          type: string
        aggregateId:
          type: string
        payload:
          type: string
          description: JSON command payload; provider credentials and bearer URLs are never included.
        status:
          $ref: '#/components/schemas/JobStatus'
        attempts:
          type: integer
          minimum: 0
        availableAt:
          $ref: '#/components/schemas/Timestamp'
        lastError:
          type: string
          description: Redacted operator-safe error summary.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    JobPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        page:
          $ref: '#/components/schemas/PageInfo'

    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, actorUserId, action, targetType, targetId, detail, createdAt]
      properties:
        id:
