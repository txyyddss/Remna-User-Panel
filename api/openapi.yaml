    Job:
      type: object
      additionalProperties: false
      required: [id, kind, aggregateId, payload, status, attempts, availableAt, lastError, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        kind:
          type: string
        aggregateId:
          type: string
        payload:
