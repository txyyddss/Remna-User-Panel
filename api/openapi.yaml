          type: [string, 'null']
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
        detail:
          type: string
          description: Redacted JSON object encoded as a string.
        createdAt:
          $ref: '#/components/schemas/Timestamp'

    AuditPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        page:
          $ref: '#/components/schemas/PageInfo'

    TelegramUpdate:
